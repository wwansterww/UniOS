name: CI

# Every push and pull request: lint, types, tests and a production build, on a clean machine.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No database, bot or scheduler in CI: tests use an in-memory Postgres (PGlite).
      SEED_DEMO: "false"
      SCHEDULER: "off"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Route types (needed by the type check)
        run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
